<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias — Buhardilla Gratis</title>
<meta name="robots" content="noindex">
<style>
:root{--navy:#0a1a2f;--teal:#0d9488;--amber:#f59e0b;--light:#f0f5fa;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,var(--navy),#0f2a45);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:#fff;border-radius:20px;padding:48px 36px;max-width:500px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.3);}
.ic{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#f0fdf4,#bbf7d0);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
h1{color:var(--teal);font-size:1.8em;font-weight:800;margin-bottom:8px;}
p{color:#4a5568;line-height:1.7;margin-bottom:6px;font-size:.98em;}
.badge{display:inline-block;background:var(--light);color:var(--gray);padding:6px 18px;border-radius:50px;font-size:.75em;margin-top:16px;font-weight:600;}
</style>
</head>
<body>
<div class="card">
<div class="ic"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
<h1>¡Gracias!</h1>
<p>Hemos recibido tu solicitud correctamente.</p>
<p>Un asesor de <strong>Buhardilla Gratis</strong> te llamará en las próximas <strong>24 horas</strong> para verificar tu elegibilidad.</p>
<div class="badge">Programa CAE 2026 — Real Decreto 36/2023</div>
</div>
</body>
</html>
